[main]
font=JetBrainsMono Nerd Font Propo:size=10.5
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,exec,categories
password-character=*

lines=10
width=38
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=20
image-size-ratio=0.5

anchor=center
x-margin=0
y-margin=0

[colors]
background=181616fa
text=c5c9c6ff
prompt=8ba4b0ff
placeholder=625e5aff
entry=c5c9c6ff
match=c80000ff
selection=2d4f67ff
selection-text=c5c9c6ff
selection-match=c8a06dff
border=8ba4b0ff

[border]
width=1
radius=4

[dmenu]
mode=text
