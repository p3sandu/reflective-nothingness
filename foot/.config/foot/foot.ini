[main]
initial-color-theme=dark
font=Jetbrainsmono Nerd Font:size=12.8
pad=0x0
vertical-letter-offset = 0
resize-by-cells = yes

[colors-dark]
alpha=1
foreground = c5c9c5
background = 181616

selection-foreground = c8c093
selection-background = 2d4f67

regular0 = 0d0c0c
regular1 = c4746e
regular2 = 8a9a7b
regular3 = c4b28a
regular4 = 8ba4b0
regular5 = a292a3
regular6 = 8ea4a2
regular7 = c8c093

bright0  = a6a69c
bright1  = e46876
bright2  = 87a987
bright3  = e6c384
bright4  = 7fb4ca
bright5  = 938aa9
bright6  = 7aa89f
bright7  = c5c9c5

16       = b6927b
17       = b98d7b
[cursor]
blink=off
style=block

[scrollback]
lines=3713


[key-bindings]
scrollback-up-line=Mod1+k
scrollback-down-line=Mod1+j
scrollback-up-page=Mod1+Shift+k
scrollback-down-page=Mod1+Shift+j
scrollback-home=Mod1+g
scrollback-end=Mod1+Shift+g

clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

font-increase=Control+Shift+plus Control+plus Control+equal Control+KP_Add
font-decrease=Control+Shift+minus Control+minus Control+KP_Subtract
font-reset=Control+Shift+0
